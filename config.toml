# ==========================================================
#  洋楽ネタ デイリーまとめ：設定ファイル
#  GitHubの画面でこのファイルを開き、鉛筆マークから編集できます。
#  「#」から始まる行はメモなので、動作には影響しません。
# ==========================================================

[general]
site_title = "洋楽ネタ・デイリー"
lookback_hours = 30            # 何時間前までの記事を集めるか
max_articles = 700             # AIに渡す記事の上限
top_n = 3                      # 毎日のトップの件数
runners_up_per_genre = 2       # ジャンル別の次点の件数
runners_up_other = 3           # 「Other（いつでも使えるネタ）」の件数（サイトのみに掲載）
candidate_count = 20           # AIに選んでもらう候補の数
min_candidates_per_genre = 4   # 各ジャンルの候補の最低数
jpy_per_usd = 150              # 費用表示に使う為替レート
site_url = ""                  # 通常は空欄でOK（自動で入ります）

[models]
cluster = "claude-haiku-4-5-20251001"   # 段階1：下ごしらえ（グループ化）
select = "claude-opus-5-5"              # 段階2：選定と執筆（頭脳）
select_effort = ""                      # 空欄＝標準。"high" にすると深く考える分、費用が増えます
compare = ""                            # 比較用（試運転で終了）。再開するときは "claude-sonnet-5-5" にする
compare_effort = ""

[selection]
audience = """
視聴者は、日本の洋楽ファン（10〜30代が中心）。
発信者は洋楽インフルエンサーで、Instagramリールで海外の音楽ニュースを紹介している。
"""
criteria = """
選定基準（上から順に重視）：
- 日本で名前が通じるアーティストか。日本のYouTube音楽チャートに入っている、来日経験がある、日本の媒体も報じている、などを手がかりにする（日本の媒体の報道は補助的な目印）
- 日本と関わりのある話題か：日本人アーティストとのコラボ、アニメ・ドラマ・CM・ゲームのタイアップ、日本のTikTokやSNSで流行った曲（来日情報は別枠で扱う）
- CNN・BBCなど一般メディアも報じる、音楽ファン以外にも届く大きな話題か
- 新曲・新作・コラボ・サプライズ発表など、30〜60秒で驚きや楽しさを伝えられるか
- MVやライブ映像など、リールで見せられる素材があるか
- ダンスミュージック（DJ・プロデューサー）の話題も、POPやHip-Hopと同じ基準で扱う
- 海外でしか知られていない話題は、「これから日本でも来る」と言える根拠があるときだけ選ぶ
- 訃報・事件・裁判などは、重大なものだけ。取り上げる場合は茶化さず事実を伝える切り口にする
"""

[youtube]
chart_regions = ["JP", "US", "GB"]   # 音楽人気チャートを見る地域（JP＝日本）
max_searches = 15              # 1日の動画検索の回数（1回100ユニット。無料枠は1日10,000）
search_days = 7                # 何日前までに公開された動画を探すか

# Claude APIの料金（100万トークンあたりのドル：入力, 出力）。費用の目安の計算だけに使います。
[prices]
"claude-haiku-4-5-20251001" = [1.0, 5.0]
"claude-sonnet-5-5" = [2.0, 10.0]
"claude-opus-5-5" = [4.0, 20.0]
"claude-fable-5-1" = [10.0, 50.0]

# ==========================================================
#  メディアの一覧
#  追加するときは、[[sources]] から始まる4〜5行をコピーして書き換えます。
#  feed が間違っていても、site から自動でRSSを探し、それでもだめなら
#  Googleニュース経由で取得します。
#  outlet：同じ媒体を別名で2回登録したときに、媒体数を二重に数えないための名前
#  group ：海外音楽（省略時）／日本／一般／来日。日本と一般は、選定で重視されます
#  region：日本語の媒体は "JP"（Googleニュースを日本版で検索します）
# ==========================================================

