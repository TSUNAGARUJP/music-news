name: 今週の音楽話題（Discord）

on:
  schedule:
    # GitHubの予約実行は数時間遅れることがあるので、何回か早めに起動し、18:00まで待ってから投稿する。
    # 18:00まで5時間30分より前に届いた回は何もせず終わり、投稿済みなら後の回も何もしない。
    - cron: "30 0 * * 6"   # 土曜 9:30（日本時間）：GitHubが大きく遅れた日のため
    - cron: "30 3 * * 6"   # 土曜 12:30：遅れがない日はこの回が18:00まで待って投稿
    - cron: "30 5 * * 6"   # 土曜 14:30：予備
  workflow_dispatch:        # 手動実行ボタン
    inputs:
      post:
        description: "Discordに投稿する（外すと内容の確認だけ）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: weekly-discord
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: 投稿時刻（18:00）まで待つ
        id: wait
        if: github.event_name == 'schedule'
        run: python3 weekly.py --wait

      - name: 最新のまとめを取り込む
        if: steps.wait.outputs.post != 'false'
        run: git pull --ff-only origin main || true

      - name: 今週の話題を選んでDiscordに投稿
        if: steps.wait.outputs.post != 'false'
        run: python3 weekly.py
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.post }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

      - name: 結果を保存
        if: always() && steps.wait.outputs.post != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data/weekly ] || exit 0
          cp -r data/weekly /tmp/new-weekly
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/weekly
          cp -r /tmp/new-weekly/. data/weekly/
          git add data/weekly
          git diff --cached --quiet || git commit -m "週まとめ $(TZ=Asia/Tokyo date +%F)"
          git push origin HEAD:main
