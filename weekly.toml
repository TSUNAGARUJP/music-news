# ==========================================================
#  スクール生向け「今週の音楽話題まとめ」（Discord）の設定
#  毎日のまとめ（data フォルダ）の1週間分から話題を選んで投稿します。
#  GitHubの画面でこのファイルを開き、鉛筆マークから編集できます。
# ==========================================================

[weekly]
title = "今週の音楽話題まとめ"
days = 7                       # 何日分のまとめから選ぶか
news_count = 3                 # 洋楽ニュースの件数
dj_count = 2                   # DJ・クラブの話題の件数
model = "claude-opus-5-5"      # 選定と執筆に使うモデル
effort = ""                    # 空欄＝標準
username = "TSUNAGARU"          # Discordに表示される投稿者名
subtitle = "今週の音楽ニュースを独自に厳選してお届け！"   # 見出しの下に入れる一文（入れないときは ""）
mention = "@everyone"          # 投稿の先頭に付けるメンション（"@here" も可。通知しないときは ""）

audience = """
読者は、DJスクールに通う生徒（DJを学んでいる初心者〜中級者）。
洋楽やダンスミュージックが好きで、DJとして知っておくと役立つ情報にも興味がある。
"""

criteria = """
洋楽ニュース（news）の選び方：
- 今週いちばん大きかった話題を選ぶ。報じた媒体の数、複数の日にわたって報じられたか、毎日のまとめでトップに選ばれたか、関連動画の再生数で判断する
- 日本でも名前が通じるアーティストを優先する
- POP・Hip-Hop・Danceなど、ジャンルが偏りすぎないようにする
- ここではDJ目線の解説はしない（一般の洋楽ニュースとして紹介する）

DJ・クラブの話題（dj）の選び方：
- DJ・プロデューサーの新曲や新作、DJランキング、大型フェスのラインナップ、有名DJの来日、DJ機材や配信サービスなど業界の動き
- スクール生が「DJとして知っておきたい」と思えるもの
"""
